# Label Bank — this vault's label vocabulary, the shared inter-skill label API.
# Schema: the vault plugin's scripts/labels.schema.json. Writers: the plugin's `label-bank`
# script (add / update / retire / rename / merge / remove), and `label-proposals accept`, which
# adds the entry and removes the proposal in one commit; never hand-edit. Only this header comment
# survives a write.
#
# Entry shape:
#   <name>:
#     when_to_apply: "…"     # classifier-facing definition
#     status: active         # active | retired. Ingest applies only active labels to new notes;
#                            # a retired label stays valid on existing notes for provenance.
#     protected: true        # optional; refuses retire, rename, merge (as the absorbed label) and remove (text may be updated)
#     origin: imported       # optional, default local; read-only to every vault writer
#
# This is a SEED bank. The action labels and the holding label below ship with every vault and
# are protected. Domain / topic / type / facet labels are DERIVED PER VAULT at create time and
# added through `label-bank add`; none ship in this template. Container labels
# (workspace:<name>, project:<name>) the vault does not own would be `origin: imported`, but no
# writer of imported entries exists yet (a future import adapter or a one-time migration seed would write them).

labels:
  todo:
    when_to_apply: >-
      The canonical actionability label. Apply when a note requires a concrete action
      from you (vs. knowledge / observation / reference). Orthogonal to
      subject/container/type labels — a note can be [idea, todo] or bare todo. Apply with
      discipline (actionable, not aspirational) or it over-applies. Pairs with note-level
      outcome: done|dropped, written by note-outcome when the action closes.
    status: active
    protected: true
  session-seed:
    when_to_apply: >-
      A genuine "work-through-this-WITH-Claude" invitation, not knowledge to file. Handled
      by a session-planner puller. Orthogonal to container labels (a note may carry
      project:<name> + session-seed, or session-seed alone).
    status: active
    protected: true
  delegated:
    when_to_apply: >-
      An action handed to someone or something else (a person, an agent, another session)
      that you are tracking rather than doing yourself. Orthogonal to subject/container
      labels.
    status: active
    protected: true
  needs-label:
    when_to_apply: >-
      This note is waiting on vocabulary: either no existing label fits its subject, or it is
      evidence for an open label proposal (_machine/label-proposals.yml). Coexists with real
      labels. Parked here, never dropped; the proposed label's name is never written to the
      note before acceptance. The synthesizer's resolve review clears it once the note is
      evidence for no remaining open proposal and its labels fit. Distinct from
      `needs-development` (that = an underdeveloped stub).
    status: active
    protected: true
  idea:
    when_to_apply: "An undeveloped concept / insight worth keeping."
    status: active
  observation:
    when_to_apply: "A noticed fact / pattern; knowledge, not action."
    status: active
